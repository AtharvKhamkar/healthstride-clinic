ls:
  # 1. Enforce strict folder naming rules globally across the source directory
  src/**:
    .dir: regex:^([a-z0-9-]+|\([a-z0-9-]+\)|\[[a-z0-9-]+\]|_[a-z0-9-]+)$

  # 2. Enforce rules for regular utilities, actions, and config files (lowercase/kebab)
  src/**/*.ts: kebab-case
  src/**/*.js: kebab-case
  src/**/*.css: kebab-case

  # 3. Enforce rules for React components and hooks
  src/**/components/*.tsx: PascalCase
  src/**/hooks/*.ts: camelCase

  # 4. Safely ignore standard Next.js special files inside the app router
  src/app/**/page.tsx: lowercase
  src/app/**/layout.tsx: lowercase
  src/app/**/loading.tsx: lowercase
  src/app/**/error.tsx: lowercase
  src/app/**/route.ts: lowercase

ignore:
  - .next
  - node_modules
  - dist
